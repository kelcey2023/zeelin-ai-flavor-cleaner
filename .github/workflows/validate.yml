name: Validate rules

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1, verified from the official release.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v7.1.0, verified from the official release.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Validate reviewed rules
        run: python scripts/lexicon.py validate
      - name: Check public package and normal examples
        run: python scripts/validate_public.py
      - name: Rebuild synthetic candidates
        run: python scripts/lexicon.py build
      - name: Validate candidate count and status
        run: python scripts/lexicon.py validate --with-candidates
