name: 补充改写案例
description: 分享有上下文的修改前后对照，说明改动依据和保留的事实。
title: "[案例] "
body:
  - type: markdown
    attributes:
      value: |
        请提供一处具体改写。好的案例应让句意更清楚，同时保留原有事实和范围。
        不需要证明原文由 AI 生成；请勿上传整篇他人文章或未获许可的稿件。
  - type: textarea
    id: before
    attributes:
      label: 修改前及必要上下文
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 修改后
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 改了什么，为什么这样改？
      description: 可从搭配、主语、宾语、指代、冗余、范围或信息增量解释。
    validations:
      required: true
  - type: textarea
    id: preserved-facts
    attributes:
      label: 保留了哪些事实或条件？
      description: 如果是构造例句，请注明。若涉及数据，说明改前改后数值和单位是否一致。
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: 使用场景
      placeholder: "例如：科技公众号正文、产品说明、小标题。"
    validations:
      required: true
  - type: textarea
    id: exception
    attributes:
      label: 哪些情况不适合照着改？（可选）
      description: 可提供正常反例、术语用法或需要保留的引语。
  - type: dropdown
    id: source-kind
    attributes:
      label: 例句来自哪里？
      options:
        - 本人写作或本人改稿
        - 本人获得的模型输出
        - 公开文章或公开讨论
        - 为说明问题自行构造的例句
        - 其他来源或暂不确定
    validations:
      required: true
  - type: textarea
    id: source-details
    attributes:
      label: 来源补充（可选）
      description: 公开原文请附链接和发布日期。模型输出可注明模型及日期。不方便公开时，请改写为不含私人信息的构造例句并注明。
      placeholder: 不粘贴整篇文章，不提供账号密码、私人联系方式或未公开材料。
  - type: checkboxes
    id: contribution-rights
    attributes:
      label: 提交确认
      description: "贡献规则见 [CONTRIBUTING.md](https://github.com/kelcey2023/zeelin-ai-flavor-cleaner/blob/main/CONTRIBUTING.md)，文字与规则许可见 [DATA_LICENSE.md](https://github.com/kelcey2023/zeelin-ai-flavor-cleaner/blob/main/DATA_LICENSE.md)。"
      options:
        - label: 我有权提交这些内容；自己的原创规则、解释与例句按 CC BY 4.0 贡献，外部引文保留来源和原有权利。
          required: true
        - label: 我已去除私人信息、未公开稿件和无权公开的内容；外部文章只提供必要短例与链接。
          required: true
