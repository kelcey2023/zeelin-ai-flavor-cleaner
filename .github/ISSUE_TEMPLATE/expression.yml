name: 提交问题表达
description: 提供一句不自然或有语病的表达，维护者会结合上下文审核。
title: "[表达] "
body:
  - type: markdown
    attributes:
      value: |
        不需要懂语法，也不需要会代码。请描述哪里读着别扭。
        一个词本身通常不能决定对错；完整句和必要上下文最有帮助。提交后先进入待审，不会自动成为禁用规则。
  - type: textarea
    id: original-context
    attributes:
      label: 原句和必要上下文
      description: 贴出问题句，并说明它是标题、正文、引语还是术语。可补前后各一句。
      placeholder: "小标题：智能体为什么会多次消耗？正文谈的是一项任务会多次调用模型。"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 你觉得哪里有问题？
      placeholder: "没有说清消耗什么，读者不知道问的是调用次数、token 用量还是费用。"
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: 使用场景
      options:
        - 科技公众号或新闻解读
        - 产品介绍或帮助文档
        - 日常中文写作
        - 学术或专业写作
        - 标题或小标题
        - 其他场景
    validations:
      required: true
  - type: textarea
    id: suggested-rewrite
    attributes:
      label: 建议怎样改？（可选）
      description: 没有把握可以留空。不要为了改顺而添加原文没有的数字、体验或因果。
      placeholder: "如果原文讲调用次数，可改为：智能体为什么需要多次调用模型？"
  - type: textarea
    id: valid-counterexample
    attributes:
      label: 什么情况下应该保留？（可选）
      description: 想一想正常用法，帮助我们避免误判。维护者也可以补充。
      placeholder: "智能体为什么会多次消耗输入 token？这句已说明消耗对象，不应仅因“多次消耗”判错。"
  - type: dropdown
    id: source-kind
    attributes:
      label: 例句来自哪里？
      options:
        - 本人写作或本人改稿
        - 本人获得的模型输出
        - 公开文章或公开讨论
        - 为说明问题自行构造的例句
        - 其他来源或暂不确定
    validations:
      required: true
  - type: textarea
    id: source-details
    attributes:
      label: 来源补充（可选）
      description: 公开原文请附链接和发布日期。模型输出可注明模型及日期。不方便公开时，请改写为不含私人信息的构造例句并注明。
      placeholder: 不粘贴整篇文章，不提供账号密码、私人联系方式或未公开材料。
  - type: checkboxes
    id: contribution-rights
    attributes:
      label: 提交确认
      description: "贡献规则见 [CONTRIBUTING.md](https://github.com/kelcey2023/zeelin-ai-flavor-cleaner/blob/main/CONTRIBUTING.md)，文字与规则许可见 [DATA_LICENSE.md](https://github.com/kelcey2023/zeelin-ai-flavor-cleaner/blob/main/DATA_LICENSE.md)。"
      options:
        - label: 我有权提交这些内容；自己的原创规则、解释与例句按 CC BY 4.0 贡献，外部引文保留来源和原有权利。
          required: true
        - label: 我已去除私人信息、未公开稿件和无权公开的内容；外部文章只提供必要短例与链接。
          required: true
